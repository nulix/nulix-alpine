name: Build image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Raspberry Pi 3 image
    runs-on: self-hosted
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build NULIX Alpine
        uses: docker/bake-action@v6
        with:
          files: |
            docker-bake.hcl
            machines/raspberry-pi-3.hcl
          targets: |
            firmware
            ostree-initramfs
            linux-kernel
            u-boot
            ostree-rootfs
            ostree-sd-image
          provenance: false

      - name: Upload OS image
        uses: actions/upload-artifact@v4
        with:
          name: nulix-os
          path: out/ostree-sd-image/nulix-os.img.bz2
          retention-days: 7 # Keep the artifact for 7 days
