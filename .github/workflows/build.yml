name: Build image

on:
  push:
    branches: [main]
    paths:
      - builder/**
      - recipes/**
      - machines/**
      - docker-bake.hcl
      - machines/raspberry-pi-3.components.json
      - scripts/machine-assets.py
      - hosted-machine-assets.hcl
      - scripts/resolve-machine-assets.py
      - .github/workflows/build.yml
  pull_request:
    paths:
      - builder/**
      - recipes/**
      - machines/**
      - docker-bake.hcl
      - machines/raspberry-pi-3.components.json
      - scripts/machine-assets.py
      - hosted-machine-assets.hcl
      - scripts/resolve-machine-assets.py
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Raspberry Pi 3 image
    runs-on: self-hosted
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build NULIX Alpine
        run: |
          args=(-f docker-bake.hcl -f machines/raspberry-pi-3.hcl)
          python3 scripts/resolve-machine-assets.py > /tmp/nulix-machine-assets.json
          cat /tmp/nulix-machine-assets.json
          overlay=$(python3 -c 'import json; print(json.load(open("/tmp/nulix-machine-assets.json"))["overlay"] or "")')
          if test -n "$overlay"; then args+=(-f "$overlay"); fi
          docker buildx bake "${args[@]}" ostree-rootfs ostree-sd-image --provenance=false

      - name: Upload OS image
        uses: actions/upload-artifact@v7
        with:
          name: nulix-os.img.bz2
          path: out/raspberry-pi-3/ostree-sd-image/nulix-os.img.bz2
          retention-days: 7 # Keep the artifact for 7 days
