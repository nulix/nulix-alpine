name: Publish versioned OS components

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Component release channel
        type: choice
        options: [stable, dev]
        default: stable
      create_namespaces:
        description: First publication to new GHCR package paths (only if GHCR returns 403 before creation)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - builder/**
      - recipes/rootfs-base/**
      - machines/raspberry-pi-3.components.json
      - recipes/linux-kernel/**
      - recipes/u-boot/**
      - recipes/firmware/**
      - recipes/ostree-initramfs/**
      - machines/raspberry-pi-3.hcl
      - docker-bake.hcl
      - scripts/machine-assets.py
      - .github/workflows/publish-machine-assets.yml

permissions:
  contents: read

concurrency:
  group: versioned-os-components-${{ inputs.channel || 'stable' }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Rootfs Base and Raspberry Pi 3 components to GHCR
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Free space for kernel compilation
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
      - name: Test asset locking
        run: python3 -m unittest discover -s tests -p '*test.py'
      - name: Reuse published components and build only missing inputs
        env:
          REPOSITORY: ${{ github.repository }}
          CHANNEL: ${{ inputs.channel || 'stable' }}
          CREATE_NAMESPACES: ${{ inputs.create_namespaces || 'false' }}
        run: |
          args=(publish --repository "$REPOSITORY" --channel "$CHANNEL")
          if test "$CREATE_NAMESPACES" = true; then args+=(--create-namespaces); fi
          python3 scripts/machine-assets.py "${args[@]}"
      - name: Save reviewed digest pins
        uses: actions/upload-artifact@v7
        with:
          name: raspberry-pi-3-machine-assets
          path: |
            machine-assets.lock.json
            hosted-machine-assets.hcl
          retention-days: 30
      - name: Open component digest update for review
        if: inputs.channel != 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if git diff --quiet -- machine-assets.lock.json hosted-machine-assets.hcl && test -z "$(git ls-files --others --exclude-standard -- machine-assets.lock.json hosted-machine-assets.hcl)"; then
            echo 'Component pins are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="foundation-assets/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git checkout -b "$branch"
          git add machine-assets.lock.json hosted-machine-assets.hcl
          git commit -m 'build: pin prebuilt Raspberry Pi 3 foundation components'
          git push origin "$branch"
          if ! gh pr create --base "$BASE_BRANCH" --head "$branch" --title 'Pin prebuilt Raspberry Pi 3 foundation components' --body 'Pins the published Rootfs Base, kernel with matching modules and DTBs, bootloader, firmware and initramfs by machine-scoped, versioned GHCR digest. Merge after review, ensure the runner can pull these packages, and publish a foundation release. User OS builds will reuse these components and build only the rootfs and image.'; then
            echo '::warning::Images and digest-pin branch were published. Automatic PR creation is unavailable; open the PR manually using the workflow summary.'
            compare_url="$SERVER_URL/$REPOSITORY/compare/$BASE_BRANCH...$branch?expand=1"
            printf '\n### Manual review needed\n\nImages are published. [Create the digest-pin pull request](%s), then review and merge it before releasing the foundation.\n' "$compare_url" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publication instructions
        if: always()
        run: |
          echo '### Foundation machine assets' >> "$GITHUB_STEP_SUMMARY"
          echo 'Merge the digest-pin PR before publishing a new foundation release. If PR creation is disabled, download the workflow artifact and commit both files manually.' >> "$GITHUB_STEP_SUMMARY"
          echo 'GHCR packages start private. Make these foundation packages public once, or configure read:packages credentials on the builder. Never add credentials to an OS image.' >> "$GITHUB_STEP_SUMMARY"
